[package]
name = "owl-ui"
version = "0.1.0"
edition = "2024"

# iced is the cross-platform GPU renderer (one code path on all three platforms).
# owl-types is the shared data vocabulary (leaf crate). The window + event source
# live in the owl-app host, not here.
[dependencies]
iced = { version = "0.14.0", features = ["tokio", "image", "markdown", "highlighter", "svg", "advanced"] }
iced_math = "0.5"
owl-provider = { path = "../owl-provider" }
owl-types = { path = "../owl-types" }
pulldown-cmark = "0.12.2"
