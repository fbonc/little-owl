[package]
name = "owl-capture"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.20"

# macOS is the only platform whose capturer is implemented, and arboard/enigo/
# axuielement are used solely by macos.rs, so scope them to macOS and avoid
# building the X11/Windows clipboard and input stacks elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3.6.1"
axuielement = "0.9.1"
enigo = "0.6.1"
# NSWorkspace, to get the frontmost app's pid: the system-wide AX element's
# focused-element read returns kAXErrorCannotComplete on some setups, so reads
# are routed through the frontmost application element (AXUIElementCreateApplication).
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
